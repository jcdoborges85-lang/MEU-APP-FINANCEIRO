<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Pessoal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md py-6">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">$$ Controle Financeiro</h1>
            <button id="open-modal-btn" class="bg-white text-blue-600 hover:bg-gray-100 font-semibold py-2 px-4 border border-blue-600 rounded shadow">
                + Nova Transação
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow">

        <!-- Dashboard Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Entradas -->
            <div class="bg-white rounded-lg shadow-md p-6 border-t-4 border-green-500">
                <h2 class="text-lg font-semibold text-gray-600 mb-2">Entradas</h2>
                <p id="total-incomes" class="text-3xl font-bold text-green-500">R$ 0,00</p>
            </div>

            <!-- Saídas -->
            <div class="bg-white rounded-lg shadow-md p-6 border-t-4 border-red-500">
                <h2 class="text-lg font-semibold text-gray-600 mb-2">Saídas</h2>
                <p id="total-expenses" class="text-3xl font-bold text-red-500">R$ 0,00</p>
            </div>

            <!-- Total -->
            <div class="bg-blue-600 text-white rounded-lg shadow-md p-6">
                <h2 class="text-lg font-semibold mb-2">Saldo Total</h2>
                <p id="total-balance" class="text-3xl font-bold">R$ 0,00</p>
            </div>
        </div>

        <!-- Transactions Table -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-xl font-bold text-gray-800">Transações Recentes</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full whitespace-nowrap">
                    <thead class="bg-gray-50 text-gray-700">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Descrição</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Valor</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Categoria</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Data</th>
                            <th class="px-6 py-3 text-center text-xs font-medium uppercase tracking-wider">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list" class="divide-y divide-gray-200">
                        <!-- Transactions will be dynamically added here -->
                    </tbody>
                </table>
            </div>
            <!-- Empty state -->
            <div id="empty-state" class="hidden p-8 text-center text-gray-500">
                Nenhuma transação cadastrada.
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-4 mt-auto">
        <p>&copy; 2023 App Controle Financeiro Pessoal</p>
    </footer>

    <!-- Add Transaction Modal -->
    <div id="transaction-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
            <div class="flex justify-between items-center px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-bold text-gray-800">Nova Transação</h3>
                <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 focus:outline-none">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="transaction-form" class="p-6">
                <!-- Description -->
                <div class="mb-4">
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                    <input type="text" id="description" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="Ex: Salário, Supermercado">
                </div>

                <!-- Amount -->
                <div class="mb-4">
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Valor (R$)</label>
                    <input type="number" id="amount" step="0.01" min="0.01" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="0.00">
                </div>

                <!-- Date -->
                <div class="mb-4">
                    <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Data</label>
                    <input type="date" id="date" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>

                <!-- Type -->
                <div class="mb-4">
                    <span class="block text-sm font-medium text-gray-700 mb-1">Tipo</span>
                    <div class="flex space-x-4">
                        <label class="inline-flex items-center">
                            <input type="radio" name="type" value="income" required class="form-radio text-blue-600 focus:ring-blue-500">
                            <span class="ml-2">Receita</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="type" value="expense" required class="form-radio text-red-600 focus:ring-red-500">
                            <span class="ml-2">Despesa</span>
                        </label>
                    </div>
                </div>

                <!-- Category -->
                <div class="mb-6">
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                    <select id="category" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        <option value="" disabled selected>Selecione uma categoria</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <!-- Submit -->
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancel-btn" class="bg-white text-gray-700 hover:bg-gray-50 border border-gray-300 font-semibold py-2 px-4 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Cancelar
                    </button>
                    <button type="submit" class="bg-blue-600 text-white hover:bg-blue-700 font-semibold py-2 px-4 border border-transparent rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
